name: Siri AI Diagnostic Build

on:
  pull_request:
    branches:
      - fix/siri-ai-beta-enrollment-diagnostics
    paths:
      - "GestaltEdit/**"
      - "GestaltEdit.xcodeproj/**"
      - ".github/workflows/siri-ai-diagnostic-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siri-ai-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    name: Audit Siri AI setup and build test IPA
    runs-on: xcode-27
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Audit Siri AI configuration safeguards
        shell: bash
        run: |
          set -euo pipefail
          MODEL="GestaltEdit/GestaltModels.swift"
          VIEWMODEL="GestaltEdit/GestaltViewModel.swift"

          test -f "$MODEL"
          test -f "$VIEWMODEL"

          # Confirm the known Siri-mode and identity fields remain explicit.
          grep -Fq 'a3n5T9sFtlyQ74NEp9ESxg' "$MODEL"
          grep -Fq 'h9jDsbgj7xIVeIQ8S3/X3Q' "$MODEL"
          grep -Fq 'oYicEKzVTz4/CxxE05pEgQ' "$MODEL"
          grep -Fq '5pYKlGnYYBzGvAlIU8RjEQ' "$MODEL"

          # Confirm the app retains device-specific recovery and post-write verification.
          grep -Fq 'SiriAIIdentityRestore.sameDevice' "$VIEWMODEL"
          grep -Fq 'SiriAIIdentityRestore.restoring' "$VIEWMODEL"
          grep -Fq 'verificationFailed' "$VIEWMODEL"
          grep -Fq 'siriAIOriginalIdentity' "$VIEWMODEL"

          # Ensure the UI does not represent local spoofing as guaranteed enrollment.
          grep -Fq 'does not guarantee' "$VIEWMODEL"
          grep -Fq 'eligibility checks' "$VIEWMODEL"

          {
            echo "## Siri AI source audit"
            echo ""
            echo "- Known MobileGestalt fields: present"
            echo "- Device-matched recovery path: present"
            echo "- Post-write verification: present"
            echo "- Enrollment limitation warning: present"
            echo ""
            echo "This audit verifies source safeguards only. It cannot query Apple's private enrollment decision or prove that an unsupported device will be offered the Siri AI beta."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned iOS archive
        run: |
          xcodebuild archive \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GestaltEdit-SiriAI.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/GestaltEdit-SiriAI.xcarchive/Products/Applications/GestaltEdit.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "GestaltEdit-SiriAI-Diagnostic.ipa" Payload

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-SiriAI-Diagnostic-IPA
          path: ${{ runner.temp }}/GestaltEdit-SiriAI-Diagnostic.ipa
          if-no-files-found: error
          retention-days: 14
